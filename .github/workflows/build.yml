# 云端打包：Windows / Linux / macOS 单文件程序 + 安卓 APK
#
# 手动触发：仓库 Actions 页 → build → Run workflow
# 自动触发：推 v* 标签（如 v0.9.14）时
#
# 产物在每次运行的 Artifacts 区下载：
#   岁月记录助手-windows / -linux / -macos / -android
#
# 说明：
#   - 单文件程序用 Node 官方 SEA（tools/build-exe.js），ffmpeg 已内置；
#   - 产物名跟 build-exe.js 的 APP_NAME 走（岁月记录助手），不再用老的 MyLife；
#   - macOS 包注入后做了 ad-hoc 签名（codesign --sign -），本机首次打开
#     若被 Gatekeeper 拦，右键 → 打开，或 `xattr -cr 岁月记录助手`；
#   - APK 是 debug 签名，装起来就能用，正式发布前再换正式签名。

name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  exe:
    name: 单文件程序 · ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows }
          - { os: ubuntu-latest,  plat: linux }
          - { os: macos-latest,   plat: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 postject（SEA 注入器）
        run: npm install postject --no-save --loglevel=error

      - name: 拉 ffmpeg（会内置进程序）
        run: node tools/fetch-ffmpeg.js

      - name: 打包 + 冒烟测试
        run: node tools/build-exe.js

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          # 产物名跟着 tools/build-exe.js 的 APP_NAME 走：Windows 带 .exe，Linux/macOS 无后缀
          for f in "dist/win/岁月记录助手.exe" "dist/win/岁月记录助手"; do
            if [ -f "$f" ]; then cp "$f" out/; fi
          done
          if [ -z "$(ls -A out)" ]; then
            echo "::error::dist/win 里没有找到可执行文件"
            ls -la dist/win || true
            exit 1
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: 岁月记录助手-${{ matrix.plat }}
          path: out/*
          if-no-files-found: error

  apk:
    name: 安卓 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 打 APK（debug 签名）
        run: gradle -p android assembleDebug --no-daemon

      - name: 改名对齐版本号
        shell: bash
        run: |
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/岁月记录助手-v${VN}-android.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: 岁月记录助手-android
          path: out/*
          if-no-files-found: error
